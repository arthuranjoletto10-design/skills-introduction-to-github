name: Build APK
on:
  push:
    branches: [ccr-64b689ba-aj5voh, main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk TrainingRoutine.apk
      - uses: actions/upload-artifact@v4
        with: { name: TrainingRoutine-apk, path: TrainingRoutine.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0-build${{ github.run_number }}
          name: TrainingRoutine ${{ github.run_number }}
          files: TrainingRoutine.apk
          target_commitish: ${{ github.sha }}
